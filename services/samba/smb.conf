# Copie de /etc/samba/smb.conf (2026-11-09), commentaires retirés.
# Noms de partages, comptes et groupe anonymisés pour la publication.
# Les mots de passe Samba sont dans la base smbpasswd, pas ici.
[global]
   workgroup = WORKGROUP
   server role = standalone server
   server string = Homelab
   security = user
   map to guest = never
   usershare allow guests = no
   server min protocol = SMB2
   smb ports = 445
   interfaces = 127.0.0.1 192.168.1.35
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.1.0/24
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[Utilisateur1]
   path = /opt/homelab/data/samba/utilisateur1
   browseable = yes
   read only = no
   valid users = utilisateur1
   create mask = 0600
   directory mask = 0700

[Utilisateur2]
   path = /opt/homelab/data/samba/utilisateur2
   browseable = yes
   read only = no
   valid users = utilisateur2
   create mask = 0600
   directory mask = 0700

[Partage]
   path = /opt/homelab/data/samba/partage
   browseable = yes
   read only = no
   valid users = @partage-groupe
   force group = partage-groupe
   create mask = 0660
   directory mask = 2770
