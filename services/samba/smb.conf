# Copie de /etc/samba/smb.conf (2026-11-09), commentaires retirés.
# Les mots de passe Samba sont dans la base smbpasswd, pas ici.
[global]
   workgroup = WORKGROUP
   server role = standalone server
   server string = Homelab familial
   security = user
   map to guest = never
   usershare allow guests = no
   server min protocol = SMB2
   smb ports = 445
   interfaces = 127.0.0.1 192.168.1.35
   bind interfaces only = yes
   hosts allow = 127.0.0.1 192.168.1.0/24
   logging = file
   log file = /var/log/samba/log.%m
   max log size = 1000

[Alex]
   path = /opt/homelab/data/samba/alex
   browseable = yes
   read only = no
   valid users = alex
   create mask = 0600
   directory mask = 0700

[Maman]
   path = /opt/homelab/data/samba/maman
   browseable = yes
   read only = no
   valid users = maman
   create mask = 0600
   directory mask = 0700

[Partage]
   path = /opt/homelab/data/samba/partage
   browseable = yes
   read only = no
   valid users = @famille
   force group = famille
   create mask = 0660
   directory mask = 2770
